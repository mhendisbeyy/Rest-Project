spring.application.name=rest-workshop
server.port=${SERVER_PORT:8080}

# Local workshop defaults; environment variables can override every connection field.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gorevdb}
spring.datasource.username=${DB_USERNAME:gorev}
spring.datasource.password=${DB_PASSWORD:gorev}

# Educational setup: keep existing rows and evolve the task table without dropping it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

app.seed-data.enabled=${SEED_DATA_ENABLED:true}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
server.error.include-stacktrace=never
server.error.include-message=never
